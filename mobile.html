<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden Neighbors — Vista de móvil</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#273f31;color:#fff6dc;font:16px system-ui,sans-serif}header{height:64px;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#213629}a,select{font:inherit;min-height:44px;border:1px solid #b9c3a0;border-radius:8px;padding:8px 10px;background:#fff6dc;color:#4a2a12;text-decoration:none}main{position:absolute;inset:70px 8px 8px;display:grid;place-items:center}.phone{position:relative;border-radius:20px;box-shadow:0 0 0 5px #101c16,0 10px 35px #0007;overflow:hidden;background:#101c16}iframe{border:0;display:block;width:390px;height:844px;transform-origin:0 0}</style></head><body><header><label for="size">Vista de teléfono</label><select id="size"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option></select><a href="./">Juego a pantalla completa</a></header><main><div class="phone"><iframe src="./" title="Garden Neighbors en un teléfono móvil" allow="autoplay"></iframe></div></main><script>const main=document.querySelector('main'),phone=document.querySelector('.phone'),frame=document.querySelector('iframe'),size=document.querySelector('select');function fit(){const [w,h]=size.value.split(',').map(Number),r=main.getBoundingClientRect(),s=Math.min(1,r.width/w,r.height/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';phone.style.width=w*s+'px';phone.style.height=h*s+'px';}size.onchange=fit;new ResizeObserver(fit).observe(main);fit();</script></body></html>
