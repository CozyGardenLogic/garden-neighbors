/* Open lawn parcels: compact raised wooden beds, with an upright front label. */
.map-screen .parcel-viewport{inset:84px 2vw 12px!important;background:transparent!important;border-radius:0;box-shadow:none;border:0;scrollbar-color:#fff6dc88 transparent;isolation:isolate;overflow-x:hidden!important}

.plot-bed-slot .map-mini-frame{position:absolute;bottom:12px;transform:rotateX(32deg)!important;transform-origin:50% 100%;filter:drop-shadow(0 12px 5px #26331360);border-radius:3px}
.plot-bed-slot .map-mini-frame:after{content:'';position:absolute;left:1px;right:1px;bottom:-13px;height:16px;z-index:2;pointer-events:none;background:#825029 url('assets/ui/ui_sign.png') center 62%/100% 340%;border:1px solid #56351c;border-top:2px solid #c08a49;border-radius:1px 1px 5px 5px;box-shadow:0 6px 6px #24341555}

.parcel .map-bed-name{margin:12px 0 0;height:36px;min-height:36px;font-size:23px;line-height:21px;z-index:2}
.parcel .plot-meters{margin:4px 0 0;height:24px;min-height:24px;z-index:2}
.parcel .plot-controls{margin-top:4px}
.parcel .map-mini-plants{clip-path:none}
.parcel .map-mini-plants .mini-plant{transform:perspective(760px) rotateX(-20deg)!important;transform-origin:50% 80%}
.parcel.current .map-mini-frame{animation:parcel-current 2.8s ease-in-out infinite!important}
.parcel .map-lock{top:42%;filter:drop-shadow(0 3px 2px #30230e66)}
.plot-bed-slot .watering-can-button,.plot-bed-slot .watering-float{top:0;right:calc(50% - var(--mini-width)/2 - 3px)}

/* Cards live inside the dark drawer well rather than on the wooden rim. */
.seed-drawer{padding:0!important}
.seed-track{flex:none;width:auto;height:auto;max-width:100%;align-content:center;grid-auto-rows:var(--tray-height);gap:6px!important}
.seed-card{transform:none!important;min-height:0!important;overflow:hidden!important}
.seed-card .seed-name{top:var(--name-top)!important;font-size:var(--tray-font)!important;line-height:17px!important;white-space:nowrap}
.compact-tray .seed-card .seed-name{top:var(--name-top)!important;font-size:var(--tray-font)!important;line-height:16px!important}
.seed-card>img,.seed-card>svg{height:var(--plant-ui-height)!important}
.seed-card .seed-count{bottom:3px!important}
.harvest-plaque{display:inline-block;position:relative;flex:0 0 104px;width:104px;height:61px;background:var(--basket-plaque) center/100% 100% no-repeat;filter:drop-shadow(0 2px 1px #46321f40)}
.harvest-plaque .harvest-amount{position:absolute;left:59%;top:25%;width:27%;height:49%;display:flex;align-items:center;justify-content:center;color:#fff0b7;font-size:23px;font-weight:700;line-height:1;text-shadow:0 2px 0 #8c6025}
.victory-card .basket-reward{display:flex!important;justify-content:center;align-items:center;gap:8px!important;max-width:100%}
@media(orientation:landscape) and (max-height:540px) and (max-width:1100px){.harvest-plaque{flex-basis:82px;width:82px;height:48px}.harvest-plaque .harvest-amount{font-size:18px}}

.seed-card>.skin-art{background-size:100% 100%!important}
.seed-drawer .seed-card .seed-count,.seed-drawer .seed-card.done .seed-count,.seed-drawer.compact-tray .seed-card.done .seed-count{top:4px;bottom:auto!important;right:4px}

@media(orientation:portrait),(max-width:650px){
 .rule-strip{height:auto!important;min-height:44px;flex-wrap:wrap;max-width:calc(100vw - 24px)!important;width:calc(var(--seed-type-count,8)*44px);justify-content:center}
}

.seed-drawer{max-width:none!important}
@media(orientation:portrait),(max-width:650px){#mobile-controls{width:calc(100vw - 24px)!important;max-width:none!important;align-self:center}}

/* Measure and center the visible numeral ink inside a safe medallion area. */
.map-decoration-shelf .basket-count,.harvest-plaque .harvest-amount{
 left:61.5%;top:32%;width:22%;height:36%;min-width:0;min-height:0;padding:0;
 overflow:hidden;text-shadow:none;line-height:1;
}
.map-decoration-shelf .basket-count svg,.harvest-plaque .harvest-amount svg{display:block;width:100%;height:100%;overflow:hidden}

/* Reserve distinct spaces for the back button, sign, and audio/settings controls. */
@media(orientation:portrait),(max-width:650px){
 .topbar .round,.world-header .round{width:48px!important;height:48px!important;min-width:48px!important;min-height:48px!important}
 .topbar .top-tools{right:0!important;top:4px!important;gap:6px!important}
 .topbar .back-button{left:0!important;top:4px!important}
 .topbar .level-sign{left:60px!important;right:114px!important;top:4px!important;width:auto!important;min-width:0!important;max-width:none!important;height:56px!important;padding:4px!important;transform:none!important}
 .topbar .level-sign strong{font-size:clamp(18px,5.6vw,23px)!important;line-height:24px!important}
 .topbar .level-sign span{font-size:clamp(12px,3.6vw,14px)!important;line-height:16px!important;white-space:normal}
 .world-header .world-tools{right:12px!important;top:6px!important;gap:6px!important}
 .world-header .world-back{left:12px!important;top:6px!important}
 .map-screen .world-header .world-sign{left:72px!important;right:126px!important;top:4px!important;width:auto!important;min-width:0!important;max-width:none!important;height:64px!important;padding:5px 3px!important;transform:none!important;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px}
 .map-screen .world-sign h1{font-size:clamp(20px,6vw,25px)!important;line-height:26px!important;white-space:nowrap}
 .map-screen .world-sign .map-summary{height:20px;min-height:20px;line-height:20px!important;font-size:16px!important;margin:0!important}
 .map-screen .world-sign .map-total-star{width:17px!important;height:17px!important;transform:none!important}
}
@media(orientation:landscape) and (max-height:540px) and (max-width:1100px){
 .map-screen .world-header .world-sign{height:56px!important;min-height:56px!important;padding:3px 10px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
 .map-screen .world-sign h1{font-size:24px!important;line-height:26px!important;flex:none;margin:0!important}
 .map-screen .world-sign .map-summary{height:18px!important;min-height:18px!important;line-height:18px!important;font-size:16px!important;margin:0!important;flex:none}
 .map-screen .world-sign .map-total-star{width:16px!important;height:16px!important;transform:none!important}
}

/* The collection animation uses the same illustrated plaque as the fixed reward. */
.harvest-overlay .harvest-collection-target{
 position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:160px;min-width:160px;height:94px;min-height:94px;
 padding:0;border:0;border-radius:0;background:transparent var(--basket-plaque) center/100% 100% no-repeat;
 box-shadow:none;filter:drop-shadow(0 4px 3px #34281350);pointer-events:none;
}
.harvest-collection-target>img{display:none}
.harvest-collection-target .basket-count{
 position:absolute;left:61.5%;top:32%;width:22%;height:36%;min-width:0;min-height:0;padding:0;
 display:block;background:none;border:0;box-shadow:none;color:#fff0b7;font-weight:700;line-height:1;text-shadow:none;overflow:hidden;
}
.harvest-collection-target .basket-count svg{display:block;width:100%;height:100%;overflow:hidden}
@media(orientation:landscape) and (max-height:540px) and (max-width:1100px){
 .harvest-overlay .harvest-collection-target{width:128px;min-width:128px;height:75px;min-height:75px;bottom:26%}
}

/* Portrait-only rule strip: one row, with a readable minimum icon size. */
html[data-portrait-rules=true] .rule-strip{display:flex!important;flex-wrap:nowrap!important;position:relative;left:auto;transform:none;align-self:center;width:max-content!important;max-width:none!important;height:var(--portrait-rule-size)!important;min-height:var(--portrait-rule-size)!important;gap:6px!important;margin:0 auto 6px!important;padding:0}
html[data-portrait-rules=true] .rule-strip>button{flex:0 0 var(--portrait-rule-size);width:var(--portrait-rule-size)!important;height:var(--portrait-rule-size)!important;min-width:var(--portrait-rule-size)!important;min-height:var(--portrait-rule-size)!important;padding:0;border:0;background:none}
html[data-portrait-rules=true] .rule-strip .rule-picture{display:block;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;padding:0;margin:0}
html[data-portrait-rules=false] .rule-strip{display:none!important}

/* A clear grass margin below the plots keeps decorations away from every control. */
.map-decoration-clearing{position:absolute;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:20px 24px;padding:12px 16px 24px;pointer-events:none}
.map-decoration-art{position:relative;flex:0 0 auto;max-width:100%;height:auto;pointer-events:none}
.map-decoration-art>img{display:block;width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 5px 4px #26331338)}
.map-decoration-sparkle{position:absolute;width:20px!important;height:20px!important;top:8%;filter:none!important;pointer-events:none}

/* Readable mobile rules without a second row of vegetable pictures. */
.mobile-rule-summary{position:relative;flex:none;align-self:center;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;width:calc(100vw - 24px);max-width:none;padding:6px 10px;margin:0 0 4px;border:0;background:none;color:#4A2A12;text-shadow:none;pointer-events:none}
.mobile-rule-summary p{position:relative;z-index:1;margin:0;padding:0;font-size:14px!important;font-weight:400;line-height:16px!important;text-align:left;overflow-wrap:normal}
html[data-mobile-rules=none] .mobile-rule-summary{display:none!important}
html[data-mobile-rules=landscape] .mobile-rule-summary{position:fixed;z-index:4;left:var(--landscape-right-x);top:var(--landscape-rule-top,56px);width:var(--landscape-right-w);margin:0}
@media(orientation:landscape) and (max-height:540px) and (max-width:1100px){
 html{background:var(--bg-game-landscape,var(--garden-fallback)) center/cover no-repeat!important;min-height:100dvh}
 html[data-screen=home]{background-image:var(--bg-start-landscape,var(--garden-fallback))!important}
 body{width:100vw!important;min-width:100vw;max-width:none;min-height:100dvh;background-size:cover!important;background-position:center!important}
 .world-screen{left:0;right:0;width:100vw!important;max-width:none}
}

/* Illustrated rule grid beside the bed on mobile; desktop retains its existing panel. */
html[data-mobile-rules=portrait] .bed-stack{width:calc(100vw - 24px)!important;align-items:flex-start}
html[data-mobile-rules=portrait] .bed-frame{width:var(--frame-w)!important}
html[data-mobile-rules=portrait] .seed-drawer,html[data-mobile-rules=portrait] .mobile-controls{align-self:center}
.mobile-rule-summary{display:block!important;padding:8px!important;pointer-events:auto;isolation:isolate}
html[data-mobile-rules=none] .mobile-rule-summary{display:none!important}
html[data-mobile-rules=portrait] .mobile-rule-summary{position:absolute;right:0;top:calc(var(--teaching-gap,0px) + var(--mobile-rule-timer-space,0px));margin:0}
.mobile-rule-summary h2{position:relative;z-index:1;font:20px/22px 'Patrick Hand',cursive;text-align:center;margin:0 0 5px}
.mobile-rule-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mobile-rule-card{display:flex;flex-direction:column;align-items:center;min-width:0;border:0;background:none;padding:0;color:#4A2A12}
.mobile-rule-card .rule-icon{width:100%;aspect-ratio:1;height:auto}
.mobile-rule-name{font:13px/15px 'Patrick Hand',cursive;white-space:nowrap}
html[data-mobile-rules=landscape] .mobile-rule-grid{grid-template-columns:repeat(var(--mobile-rule-cols,4),minmax(0,1fr));gap:4px}
html[data-mobile-rules=landscape] .mobile-rule-card .rule-icon{width:42px;height:42px}
html[data-mobile-rules=landscape] .mobile-rule-summary{padding:5px 10px!important}
html[data-mobile-rules=landscape] .mobile-rule-summary h2{display:none}


/* Rule badges share identical art and positioning in seed cards and rule panels. */
.rule-badge{position:absolute;display:grid;place-items:center;width:30%;aspect-ratio:1;height:auto;border:1.5px solid #765135;border-radius:50%;background:#FFF6DC;box-shadow:0 1px 2px #4a2a1233;z-index:5;pointer-events:none;overflow:hidden;padding:1px}
.rule-badge img,.rule-badge svg{display:block!important;position:static!important;width:100%!important;height:100%!important;max-height:none!important;min-height:0!important;object-fit:contain!important;opacity:1!important}
.soil-badge{left:3%;top:3%}.neighbor-badge{right:3%;top:39%}
.rule-badge.forbidden:before,.rule-badge.forbidden:after{content:'';position:absolute;left:8%;top:46%;width:84%;height:2px;background:#C0392B;border-radius:2px;transform:rotate(45deg);z-index:2}
.rule-badge.forbidden:after{transform:rotate(-45deg)}
.seed-card .seed-name,.seed-card .seed-count{z-index:7}
.seed-card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rule-icon .rule-ground{background:none}.rule-icon .rule-adult{left:8%;top:6%;width:84%;height:88%}
.portrait-rule-list{position:relative;flex:none;display:grid;grid-template-columns:minmax(0,1fr);gap:5px 14px;padding:12px 16px;margin-top:6px;isolation:isolate;align-self:center}

function alphaBounds(data,width,height,threshold=0){let left=width,top=height,right=-1,bottom=-1;for(let y=0;y<height;y++)for(let x=0;x<width;x++)if(data[(y*width+x)*4+3]>threshold){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);}return right<0?{x:0,y:0,width,height}:{x:left,y:top,width:right-left+1,height:bottom-top+1};}

function attachSeedRuleHint(scene,card,type){
 const down=card.onpointerdown;let hold=null,hover=null,start=null;
 const clear=()=>{clearTimeout(hold);clearTimeout(hover);hold=hover=null;};
 card.onpointerdown=e=>{clear();start={x:e.clientX,y:e.clientY,id:e.pointerId};down?.(e);if(scene.modal||scene.winning)return;
  hold=setTimeout(()=>{hold=null;if(!card.isConnected||scene.modal||scene.winning||scene.seedGesture?.drag)return;
   if(scene.seedGesture)scene.seedGesture.ruleHeld=true;scene.showRuleTip(type,card);},400);};

}
