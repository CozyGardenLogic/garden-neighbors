const rewardsHome=Game.prototype.showHome;Game.prototype.showHome=function(){rewardsHome.call(this);const actions=this.worldScreen.querySelector('.home-actions'),b=document.createElement('button'),locked=Rewards.totalStars()<6;b.className='wood-button daily-button'+(locked?' daily-locked':'');b.textContent=TEXT.dailyGarden;if(locked){b.innerHTML=uiIcon('icon_lock','help')+' '+TEXT.dailyGarden;b.setAttribute('aria-label',TEXT.dailyLocked);}b.onclick=()=>{if(locked){modalContent(this,TEXT.dailyGarden,TEXT.dailyLocked,null,[[TEXT.close,()=>this.dismissPanel(),true]]);ModalState.dismiss=()=>this.dismissPanel();}else this.startDaily();};actions.append(b);const streak=DailyGarden.streak();if(streak){const p=document.createElement('p');p.className='daily-meta';p.textContent=(streak===1?TEXT.streakOne:fmt(TEXT.streak,{n:streak}));actions.append(p);}themeDOM();};
const rewardsMap=Game.prototype.showMap;Game.prototype.showMap=function(options){const pending=Rewards.pending();this.pendingUnlockNotice=pending;rewardsMap.call(this,options);if(pending.length){this.showMapMessage(pending.map(unlockText).join('\n'),4500,true);Rewards.seen(pending);this.newUnlocks=[];}else Rewards.seen([10,25,45].filter(n=>Rewards.totalStars()>=n));};
const rewardsMapFinish=Game.prototype.finishMapTransition;Game.prototype.finishMapTransition=function(){rewardsMapFinish.call(this);if(this.pendingUnlockNotice?.length){this.showMapMessage(this.pendingUnlockNotice.map(unlockText).join('\n'),4500,true);this.pendingUnlockNotice=[];}Rewards.seen([10,25,45].filter(n=>Rewards.totalStars()>=n));};
const rewardsWater=Game.prototype.waterParcel;Game.prototype.waterParcel=function(i){const before=Watering.get(i).lastDay;rewardsWater.call(this,i);if(Watering.get(i).lastDay!==before){const board=Progress.data.layouts[i]||solve(LEVELS[i]);Rewards.award('water:'+i+':'+Watering.today(),board);const node=this.mapNodes?.[i],items=[];for(const p of node?.querySelectorAll('.mini-plant')||[]){const r=p.getBoundingClientRect();items.push({type:p.dataset.type,x:r.left+r.width/2-23,y:r.top+r.height/2-23});}const total=Rewards.total(),count=Object.values(boardCounts(board)).reduce((a,b)=>a+b,0),badge=this.worldScreen?.querySelector('.basket-count');if(badge)badge.textContent=total-count;this.mapDelay(()=>this.flyToBasket(items,{onCount:()=>this.refreshBasket()}),Math.min(900,Motion.reduced?0:900));}};
Game.prototype.startDaily=async function(){if(Rewards.totalStars()<6)return;const day=DailyGarden.today();if(DailyGarden.data.results[day]){this.showDailyResult(day);return;}modalContent(this,TEXT.dailyGarden,TEXT.dailyGenerating);try{const l=await DailyGarden.puzzle(day);if(day!==DailyGarden.today()){this.dismissPanel();return this.startDaily();}this.closeWorld();this.clearHarvest();closeModal(this);AudioGarden.clearEffects();this.scene.restart({level:0,daily:l});}catch(e){console.error(e);modalContent(this,TEXT.dailyGarden,TEXT.retry,null,[[TEXT.retry,()=>this.startDaily(),true],[TEXT.close,()=>this.dismissPanel()]]);}};
const rewardsCreate=Game.prototype.create;Game.prototype.create=function(){rewardsCreate.call(this);if(this.dailyDate){this.teachingDone=true;this.updateTeachingBubble();this.updateClockUI();this.layoutMetrics();const unfamiliar=Object.keys(this.l.seeds).filter(t=>!LEVELS.slice(0,Math.max(1,Progress.next()+1)).some(l=>l.seeds[t]));if(unfamiliar.length){modalContent(this,TEXT.dailyRules,TEXT.dailyRulesHelp,null,[[TEXT.got,()=>this.dismissPanel(),true]]);const grid=document.createElement('div');grid.className='daily-rules-intro';for(const t of unfamiliar){const row=document.createElement('div');row.innerHTML=assetMarkup(t+'_adult',plantFallbackSVG(t,'adult'));const p=document.createElement('p');p.textContent=TEXT.rule[t];row.append(p);grid.append(row);}$('modal-card').insertBefore(grid,$('modal-card').lastChild);}}this.events.once('shutdown',()=>{this.ruleTip?.remove();clearTimeout(this.ruleTipTimer);document.querySelectorAll('.collection-flight').forEach(e=>e.remove());});};
const rewardsClock=Game.prototype.updateClockUI;Game.prototype.updateClockUI=function(){if(!this.dailyDate)return rewardsClock.call(this);const clock=$('progress'),enabled=!this.worldScreen,key=timeText(this.challengeClock.elapsed);clock.hidden=!enabled;clock.classList.remove('time-reached');clock.textContent=key;clock.setAttribute('aria-label',TEXT.timer+' '+key);clock.title=TEXT.dailyGarden;AudioManager.stopClockTick();};
const rewardsWin=Game.prototype.checkWin;Game.prototype.checkWin=function(){if(this.dailyDate&&this.dailyDate!==DailyGarden.today()&&!this.winning){if(!this.modal){modalContent(this,TEXT.dailyExpired,'',null,[[TEXT.play,()=>this.startDaily(),true]]);}return;}rewardsWin.call(this);};
Game.prototype.showDailyResult=function(day=this.dailyDate||DailyGarden.today()){const r=DailyGarden.data.results[day];if(!r)return;this.clearHarvest();if(this.dailyDate===day)for(const v of this.views.values()){v.cancel();v.phase('adult');v.restoreColor();}modalContent(this,fmt(TEXT.dailyNumber,{n:DailyGarden.number(day)}),TEXT.dailyReturn,null,[[TEXT.share,()=>this.shareDaily(day),true],[TEXT.myGarden,()=>this.showMap({animate:false}),false],[TEXT.home,()=>this.showHome(),false]]);const host=$('modal-card'),stars=document.createElement('div');stars.className='stars skip';for(let i=0;i<3;i++){const span=document.createElement('span');span.innerHTML=uiIcon(i<r.stars?'icon_star':'icon_star_empty');stars.append(span);}host.insertBefore(stars,host.lastChild);if(r.stars<3){const advice=document.createElement('p');advice.className='star-advice';advice.textContent=r.stars===1?TEXT.starHintAdvice:TEXT.starWiltAdvice;host.insertBefore(advice,host.lastChild);}const p=document.createElement('p');p.className='time-record';p.textContent=fmt(TEXT.timeBest,{time:timeText(r.time),best:timeText(Rewards.data.bestTimes['daily:'+day]??r.time)})+(this.dailyDate===day&&this.newTimeBest?' · '+TEXT.newBest:'');if(this.dailyDate===day&&this.newTimeBest&&!this.bestSoundPlayed){this.bestSoundPlayed=true;AudioManager.effect('sfx_star');}host.insertBefore(p,host.lastChild);const streak=document.createElement('p');streak.className='daily-meta';streak.textContent=(DailyGarden.streak()===1?TEXT.streakOne:fmt(TEXT.streak,{n:DailyGarden.streak()}));host.insertBefore(streak,host.lastChild);const status=document.createElement('p');status.className='daily-share-status';status.setAttribute('aria-live','polite');host.insertBefore(status,host.lastChild);themeDOM();};
Game.prototype.shareDaily=async function(day){const r=DailyGarden.data.results[day];if(!r)return;const emoji={tomato:'🍅',lettuce:'🥬',basil:'🌿',mint:'🌱',peas:'🫛',onion:'🧅',beans:'🫘',pumpkin:'🎃'},text=`Garden Neighbors · Daily #${DailyGarden.number(day)} ${'⭐'.repeat(r.stars)} ⏱ ${timeText(r.time)}\n${r.plants.map(t=>emoji[t]).join(' ')}\nhttps://cozygardenlogic.github.io/garden-neighbors/`;let copied=false;try{await navigator.clipboard.writeText(text);copied=true;}catch(e){const input=document.createElement('textarea'),focus=document.activeElement;input.value=text;input.setAttribute('readonly','');Object.assign(input.style,{position:'fixed',left:'0',top:'0',width:'1px',height:'1px',opacity:'0'});document.body.append(input);input.select();input.setSelectionRange(0,text.length);try{copied=document.execCommand('copy');}catch(error){}input.remove();focus?.focus?.({preventScroll:true});}if(navigator.share)try{await navigator.share({title:TEXT.title,text});}catch(e){if(e.name!=='AbortError')console.info('Share unavailable; result is ready to copy.');}const status=$('modal-card').querySelector('.daily-share-status');if(status){status.textContent=copied?TEXT.shared:TEXT.copyFailed+' '+text;if(!copied)status.style.userSelect='text';}};
